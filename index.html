<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NoGravity Apps — something great is coming soon.">
  <title>NoGravity Apps | Coming Soon</title>
  <style>
    :root {color-scheme:dark; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    * {box-sizing:border-box;}
    body {margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 20%,#1d3160 0,transparent 45%),linear-gradient(140deg,#080d1b,#111c34);color:#fff;display:flex;flex-direction:column;}
    header {padding:30px clamp(24px,6vw,90px);font-weight:800;letter-spacing:-.04em;font-size:1.35rem;}
    .mark {display:inline-block;width:11px;height:11px;border:2px solid #75e6ff;border-radius:50%;margin-right:10px;box-shadow:0 0 18px #75e6ff88;}
    main {flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
    .content {max-width:760px;}
    .eyebrow {font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;color:#83e9ff;font-weight:700;}
    h1 {font-size:clamp(3.2rem,9vw,6.4rem);letter-spacing:-.075em;line-height:1.02;margin:18px 0 24px;}
    h1 span {background:linear-gradient(90deg,#79eaff,#a69aff);background-clip:text;-webkit-background-clip:text;color:transparent;}
    p {max-width:570px;margin:0 auto;font-size:clamp(1rem,2vw,1.2rem);line-height:1.7;color:#b5c2da;}
    .line {width:72px;height:3px;border-radius:3px;background:linear-gradient(90deg,#79eaff,#a69aff);margin:36px auto;}
    footer {text-align:center;padding:22px;color:#8292b2;font-size:.85rem;}
  </style>
</head>
<body>
  <header><span class="mark" aria-hidden="true"></span>NoGravity Apps</header>
  <main>
    <div class="content">
      <div class="eyebrow">A new experience is on the horizon</div>
      <h1>Big ideas.<br><span>Zero gravity.</span></h1>
      <p>We're building something exciting. Our website is coming soon — stay tuned for what's next from NoGravity Apps.</p>
      <div class="line" aria-hidden="true"></div>
    </div>
  </main>
  <footer>&copy; <span id="year">2026</span> NoGravity Apps. All rights reserved.</footer>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
